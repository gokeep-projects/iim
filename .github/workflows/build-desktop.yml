name: Build desktop clients

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_glob: src-tauri/target/release/bundle/**/*
          - name: Linux
            os: ubuntu-22.04
            artifact_glob: src-tauri/target/release/bundle/**/*
          - name: macOS
            os: macos-latest
            artifact_glob: src-tauri/target/release/bundle/**/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run src/components/ConversationList.test.ts src/App.test.ts --pool=threads --maxWorkers=1 --minWorkers=1

      - name: Build Tauri client
        run: npm run tauri -- build

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: iim-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
