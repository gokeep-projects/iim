<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iim</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui,
          sans-serif;
        background: #eef3f8;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 16% 20%, rgba(27, 118, 255, 0.18), transparent 28%),
          radial-gradient(circle at 86% 12%, rgba(21, 194, 160, 0.16), transparent 30%),
          linear-gradient(135deg, #f8fbff 0%, #edf4fb 46%, #f7fbf8 100%);
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #0f172a;
      }

      #startup-shell::before {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px solid rgba(37, 99, 235, 0.12);
        background:
          linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(20, 184, 166, 0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(circle, #000 20%, transparent 72%);
        animation: startup-grid 7s linear infinite;
      }

      .startup-shell-card {
        position: relative;
        width: min(420px, calc(100vw - 48px));
        padding: 30px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 28px 90px rgba(15, 23, 42, 0.16);
        backdrop-filter: blur(22px);
      }

      .startup-shell-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
      }

      .startup-shell-logo {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #2563eb, #16a34a);
        color: white;
        font-size: 28px;
        font-weight: 800;
        box-shadow: 0 14px 34px rgba(37, 99, 235, 0.28);
      }

      .startup-shell-card strong {
        display: block;
        font-size: 20px;
        line-height: 1.2;
      }

      .startup-shell-card p {
        margin: 6px 0 0;
        color: #475569;
        font-size: 14px;
      }

      .startup-shell-progress {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #dbe6f1;
      }

      .startup-shell-progress span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #14b8a6, #84cc16);
        animation: startup-progress 1.4s ease-in-out infinite;
      }

      .startup-shell-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 14px;
        color: #64748b;
        font-size: 12px;
      }

      @keyframes startup-progress {
        0% {
          transform: translateX(-70%);
        }
        55% {
          transform: translateX(95%);
        }
        100% {
          transform: translateX(160%);
        }
      }

      @keyframes startup-grid {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(28px, 28px, 0);
        }
      }
    </style>
  </head>
  <body>
    <section id="startup-shell" role="status" aria-label="启动进度" aria-live="polite">
      <div class="startup-shell-card">
        <div class="startup-shell-brand">
          <span class="startup-shell-logo">i</span>
          <div>
            <strong>iim</strong>
            <p>正在连接内网直连核心</p>
          </div>
        </div>
        <div class="startup-shell-progress" aria-hidden="true"><span></span></div>
        <div class="startup-shell-meta">
          <span>加载身份与本地消息</span>
          <span>安全直连启动中</span>
        </div>
      </div>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
