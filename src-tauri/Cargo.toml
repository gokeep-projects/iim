[package]
name = "iim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["xuning"]
description = "A reliable peer-to-peer instant messenger for local networks."
homepage = "https://spurh.com"

[lib]
name = "iim"
path = "src/lib.rs"

[[bin]]
name = "iim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
anyhow = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
hostname = "0.4"
quinn = { version = "0.11", optional = true }
rand = "0.8"
rcgen = { version = "0.13", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.9.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
tauri-plugin-notification = "2.3.1"
tauri-plugin-opener = "2.5.0"
tauri-plugin-shell = "2.3.1"
thiserror = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
uuid = { version = "1.11", features = ["v4", "serde"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.13"

[features]
default = ["sqlcipher", "quic"]
quic = ["quinn", "rcgen", "tokio"]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
